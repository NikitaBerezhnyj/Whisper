name: Build and Release Whisper

permissions:
  contents: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from options.rpy
        id: get_version
        run: |
          VERSION=$(grep -m 1 "define config.version" game/options.rpy | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")
          if [ -z "$VERSION" ]; then
            VERSION="0.1.0-dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected project version: $VERSION"

      - name: Download Ren'Py SDK
        run: |
          RENPY_VERSION="8.2.2"
          wget -q https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-sdk.tar.bz2
          tar -xf renpy-${RENPY_VERSION}-sdk.tar.bz2
          echo "RENPY_DIR=$GITHUB_WORKSPACE/renpy-${RENPY_VERSION}-sdk" >> $GITHUB_ENV

      - name: Build Distributions
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          python3 $RENPY_DIR/renpy.py $RENPY_DIR launcher distribute --package windows $GITHUB_WORKSPACE
          python3 $RENPY_DIR/renpy.py $RENPY_DIR launcher distribute --package linux $GITHUB_WORKSPACE
          python3 $RENPY_DIR/renpy.py $RENPY_DIR launcher distribute --package mac $GITHUB_WORKSPACE

      - name: Prepare and Rename Artifacts
        run: |
          mkdir -p dist
          VERSION="${{ steps.get_version.outputs.version }}"
          cp *-windows.zip dist/Whisper-v${VERSION}-Windows.zip || true
          cp *-linux.tar.bz2 dist/Whisper-v${VERSION}-Linux.tar.bz2 || true
          cp *-mac.zip dist/Whisper-v${VERSION}-MacOS.zip || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whisper-pc-builds
          path: dist/*

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: whisper-pc-builds
          path: ./artifacts

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.build-pc.outputs.version }}"

          gh release create "v$VERSION" \
            --title "Whisper v$VERSION" \
            --generate-notes || true

          for file in ./artifacts/*; do
            if [ -f "$file" ]; then
              gh release upload "v$VERSION" "$file" --clobber
            fi
          done
